services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - ENGINE_URL=http://engine:8000
    depends_on:
      - engine
    restart: unless-stopped

  engine:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    # Engine stays internal (web proxies via ENGINE_URL). Host 8100 is local-only convenience.
    ports:
      - "8100:8000"
    environment:
      - APP_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - engine_data:/app/data
    restart: unless-stopped

volumes:
  engine_data:
