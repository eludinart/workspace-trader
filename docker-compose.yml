services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - ENGINE_URL=http://engine:8000
      # Public key optional at runtime via engine API; keep for build-time if set.
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - WEB_PUSH_ENABLED=${WEB_PUSH_ENABLED:-false}
    depends_on:
      - engine
    restart: unless-stopped

  engine:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    # Engine stays internal (web proxies via ENGINE_URL). Host 8100 is local-only convenience.
    ports:
      - "8100:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - TRADER_CONTROL_TOKEN=${TRADER_CONTROL_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - WEB_PUSH_ENABLED=${WEB_PUSH_ENABLED:-false}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:ops@eludein.art}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    volumes:
      - engine_data:/app/data
    restart: unless-stopped

  trader:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    command: ["python", "-m", "app.trader_main"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - WEB_PUSH_ENABLED=${WEB_PUSH_ENABLED:-false}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:ops@eludein.art}
    volumes:
      - engine_data:/app/data
    restart: unless-stopped
    depends_on:
      - engine

volumes:
  engine_data:
